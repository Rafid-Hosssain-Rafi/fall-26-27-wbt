<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blood Donation Form</title>
  </head>
  <body>
    <form methord="post">
      <h2>Donor Information</h2>

      <table>
        <tr>
          <td><label for="firstname">First Name : </label></td>
          <td><input type="text" id="firstname" name="firstname" required /></td>
        </tr>

        <tr>
          <td><label for="lastname">Last Name : </label></td>
          <td><input type="text" id="lastname" name="lastname" required /></td>
        </tr>

        <tr>
          <td><label for="company"> Company : </label></td>
          <td><input type="text" id="company" name="company" /></td>
        </tr>

        <tr>
          <td><label for="address1"> Adress 1 : </label></td>
          <td><input type="text" id="address1" name="address1" required /></td>
        </tr>

        <tr>
          <td><label for="address2"> Adress 2 : </label></td>
          <td><input type="text" id="address2" name="address2" required /></td>
        </tr>

        <tr>
          <td><label for="city"> City : </label></td>
          <td><input type="text" id="city" name="city" required /></td>
        </tr>

        <tr>
          <td><label for="state"> State : </label></td>

          <td>
            <select id="state" name="state">
              <option>Select a state</option>
              <option>Florida</option>
              <option>California</option>
              <option>Gujrat</option>
              <option>Other</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="zip"> ZIP Code : </label></td>
          <td><input type="text" id="zip" name="zip" required /></td>
        </tr>

        <tr>
          <td><label for="country"> Country : </label></td>

          <td>
            <select id="country" name="country">
              <option>Select a country</option>
              <option>Bangladesh</option>
              <option>Nepal</option>
              <option>Indonesia</option>
              <option>Other</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="phone"> Phone : </label></td>
          <td><input type="tel" id="phone" name="phone" /></td>
        </tr>

        <tr>
          <td><label for="fax"> Fax : </label></td>
          <td><input type="text" id="fax" name="fax" /></td>
        </tr>

        <tr>
          <td><label for="email"> Email : </label></td>
          <td><input type="email" id="email" name="email" required /></td>
        </tr>

        <tr>
          <td>
            <label for="da">
              Donation Amount :
              <p>(Check a button or type in your amount)</p></label
            >
          </td>
          <td>
            <input type="radio" id="da" name="da" required />
            <label for="da">None</label>
            <input type="radio" id="da" name="da" value="50" required />
            <label for="da">$50</label>
            <input type="radio" id="da" name="da" value="75" required />
            <label for="da">$75</label>
            <input type="radio" id="da" name="da" value="100" required />
            <label for="da">$100</label>
            <input type="radio" id="da" name="da" value="250" required />
            <label for="da">$250</label>
            <input type="radio" id="da" name="da" required />
            <label for="da">Other</label>
          </td>
        </tr>
        <tr>
          <td><label for="otheramount"> Other Amount $ : </label></td>
          <td><input type="number" id="otheramount" name="otheramount" required /></td>
        </tr>

        <tr>
          <td>
            <label for="recdonation">
              Recurring Donation :
              <p>(Check if yes)</p></label
            >
          </td>
          <td>
            <input type="checkbox" value="checkbox" id="recdonation" name="recdonation" />
            <label for="recdonation">I am intrested in giving on a regular basis</label>
          </td>
          <td></td>
          <tr><td></td>
          <td>
            <label for="credit">Monthly Credit Card $ </label>
            <input type="text" name="credit" id="credit" />
            <label for="month">For</label>
            <input type="text" name="month" id="month" />
          </td>
          </tr>
        </tr>
      </table>
    </form>
  </body>
</html>
